[package]
name = "ss14-launcher-rust"
version = "0.1.7"
edition = "2021"
license = "MIT"

[dependencies]

eframe = "0.29"

egui = "0.29"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
shell-words = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "2.2", default-features = false, features = ["aes-crypto", "bzip2", "deflate", "deflate64", "time", "zstd"] }
walkdir = "2.5"
urlencoding = "2.1"
zstd = "0.13"
blake2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

[dev-dependencies]
ab_glyph = "0.2"

